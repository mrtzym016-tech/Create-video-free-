<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صانع الفيديو المجاني</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; color: #333; text-align: center; padding: 50px; }
        .container { background: #fff; padding: 40px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        input, button { padding: 10px; margin: 10px; border-radius: 5px; border: 1px solid #ccc; }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>صانع الفيديو بالذكاء الاصطناعي</h1>
        <p>اكتب فكرة الفيديو، وسيقوم الخادم بإنشائه لك (قد يستغرق دقائق).</p>
        
        <!-- في النسخة الحقيقية سنربط هذا النموذج بخادم Python أو خدمة استضافة مجانية -->
        <form action="https://your-backend-url.com/create" method="POST">
            <input type="text" name="idea" placeholder="مثال: فيديو تحفيزي عن النجاح" required size="30">
            <br>
            <button type="submit">إنشاء الفيديو الآن</button>
        </form>
    </div>
</body>
</html>
